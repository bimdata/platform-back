# This file is generated by ansible

name: Test, build and deploy

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    runs-on: self-hosted-common
    services:
      postgres:
        image: docker-registry.bimdata.io/dockerhub/library/postgres:17
        credentials:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
        env:
          POSTGRES_USER: bimdata
          POSTGRES_PASSWORD: bimdata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bimdata"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
        env:
          POETRY_HOME: ${{ github.workspace }}/.${{ env.PYTHON_VERSION }}-poetry
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
      - name: Install api
        run: poetry install --no-interaction
      - name: Run tests
        run: >
          poetry run pytest
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: platform-back
          TEST_DB_USER: bimdata
          TEST_DB_PASSWORD: bimdata
  build-and-push:
    runs-on: self-hosted-common
    needs: [test]
    if: contains(fromJSON('["refs/heads/develop", "refs/heads/release", "refs/heads/master", "refs/heads/main"]'), github.ref)
    steps:
      - uses: actions/checkout@v7
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          tags: |
            docker-registry.bimdata.io/bimdata/platform_back:${{ github.sha }}
            docker-registry.bimdata.io/bimdata/platform_back:${{ env.tag }}
          # Runners are ephemeral: layer cache per environment in our registry, falling back on staging
          cache-from: |
            type=registry,ref=docker-registry.bimdata.io/bimdata/platform_back:buildcache-${{ env.tag }}
            type=registry,ref=docker-registry.bimdata.io/bimdata/platform_back:buildcache-staging
          cache-to: type=registry,ref=docker-registry.bimdata.io/bimdata/platform_back:buildcache-${{ env.tag }},mode=max,image-manifest=true
  deploy:
    runs-on: self-hosted-deploy
    needs: build-and-push
    steps:
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Deploy on ${{ env.tag }}
        uses: bimdata/actions/deployment@v6
        with:
          inventory: ${{ env.tag }}
          app: platform-back
          vault-pass: ${{ secrets.ANSIBLE_VAULT_PASSWD }}
