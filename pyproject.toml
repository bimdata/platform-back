[tool.poetry]
name = "platform-back"
version = "1.0.0"
description = ""
authors = ["BIMData Team <infra@bimdata.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
bimdata-api-client = "10.14.4"
celery = "^5.7.0"
coreapi = "^2.3.3"
django = {extras = ["argon2"], version = "^6.0"}
django-celery-beat = "^2.9.0"
django-cors-headers = "^4.9.0"
django-environ = "^0.14.0"
django-filter = "^26.2"
django-grappelli = "^5.0.1"
django-health-check = "^3.20.8"
django-json-widget = "^2.1.1"
django-replicated = {git = "https://github.com/bimdata/django_replicated.git"}
django-split-settings = "^1.0.1"
django-timezone-field = "^7.2.2"
djangorestframework = "^3.18.3"
drf-oidc-auth = "^4.0.0"
drf-spectacular = {extras = ["sidecar"], version = "^0.30.0"}
fluent-logger = "^0.11.1"
gunicorn = "^26.2.0"
inflection = "^0.5.1"
psycopg = {extras = ["binary", "pool"], version = "^3.3.8"}
python-dotenv = "^1.2.4"
requests = "^2.34.2"
urllib3 = ">=2.6.1" # Needed because the lib API use getheader removed in 2.6.0 (readded in 2.6.1) (20251218, TODO: fix lib api and remove from here)
whitenoise = "^6.12.0"

[tool.poetry.group.deploy]
optional = true

[tool.poetry.group.deploy.dependencies]
gunicorn = "^26.2.0"
uvicorn = "^0.40.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
django-debug-toolbar = "^8.0.0"
flake8 = "^7.5.0"
flake8-no-implicit-str-concat-in-list = "^0.1.0"
pre-commit = "^4.7.0"
pycodestyle = "2.15.0"
pyflakes = "^4.1.0"
reorder-python-imports = "^3.19.0"

[tool.poetry.group.test.dependencies]
pytest-django = "^4.14"

[tool.black]
line-length = 95
[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
